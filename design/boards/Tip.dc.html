<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a tip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#3D3D3A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #111111; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
    <a href="Items.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="width: 64px; height: 25px; overflow: hidden" aria-label="tab." role="img">
      <img src="/_blob/c01bdf59c4e277fa907d4dd945951896" alt="" style="width: 92px; height: auto; margin: -9px 0 0 -13px; display: block; mix-blend-mode: multiply">
    </div>
    <span style="font-family: 'Space Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1.5px solid #111111; border-radius: 6px">TABLE 07</span>
  </header>

  <div style="flex: 1 1 auto; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Add a tip</h1>
      <p style="margin: 0; font-size: 14px; color: #5C5C58">Your share is <span style="font-family: 'Space Mono', monospace; color: #111111">$35.03</span> with HST included.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px" role="group" aria-label="Tip amount">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
        <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 88px; border-radius: 14px; border: 1.5px solid #111111; background: {{o.bg}}; color: #111111; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: Inter, system-ui, sans-serif">
          <span style="font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700">{{o.label}}</span>
          <span style="font-size: 13px; color: #3D3D3A">{{o.sub}}</span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{isCustom}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="custom-tip" style="font-size: 13px; font-weight: 600">Custom tip in dollars</label>
        <input id="custom-tip" type="number" inputmode="decimal" min="0" step="0.01" value="{{customVal}}" onChange="{{setCustom}}" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #111111; background: #FFFFFF; padding: 0 14px; font-family: 'Space Mono', monospace; font-size: 18px; color: #111111">
      </div>
    </sc-if>

    <p style="margin: 0; font-size: 12px; color: #5C5C58; line-height: 1.45">Tip is worked out on your pre-tax amount ($31.00), then added on top.</p>

    <section style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px" aria-label="Summary">
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5C5C58"><span>Your items</span><span style="font-family: 'Space Mono', monospace">$31.00</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5C5C58"><span>HST 13%</span><span style="font-family: 'Space Mono', monospace">$4.03</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5C5C58"><span>Tip</span><span style="font-family: 'Space Mono', monospace">{{tip}}</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; padding-top: 8px; border-top: 1.5px dashed #111111"><span>You pay</span><span style="font-family: 'Space Mono', monospace">{{total}}</span></div>
    </section>
  </div>

  <div style="padding: 14px 20px 28px; border-top: 1px solid #E2E0DA">
    <a href="Pay.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; border-radius: 14px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600"><span>Go to payment</span><span style="font-family: 'Space Mono', monospace">{{total}}</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#FFD23F","#9AD4FF","#FFB8A8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 18, custom: 500 }; }
  renderVals() {
    const base = 3100, tax = 403;
    const s = this.state;
    const accent = this.props.accent ?? '#C8F031';
    const fmt = (c) => '$' + (c / 100).toFixed(2);
    const tipFor = (p) => Math.round(base * p / 100);
    const tip = s.pick === 'custom' ? s.custom : tipFor(s.pick);
    const opts = [15, 18, 20].map((p) => ({
      label: p + '%', sub: fmt(tipFor(p)), on: s.pick === p,
      bg: s.pick === p ? accent : '#FFFFFF',
      pick: () => this.setState({ pick: p })
    }));
    opts.push({ label: 'Custom', sub: s.pick === 'custom' ? fmt(s.custom) : 'Any amount', on: s.pick === 'custom',
      bg: s.pick === 'custom' ? accent : '#FFFFFF', pick: () => this.setState({ pick: 'custom' }) });
    return {
      opts: opts,
      isCustom: s.pick === 'custom',
      customVal: (s.custom / 100).toFixed(2),
      setCustom: (e) => { const v = Math.max(0, Math.round(parseFloat(e.target.value || '0') * 100)); this.setState({ custom: isNaN(v) ? 0 : v }); },
      tip: fmt(tip),
      total: fmt(base + tax + tip)
    };
  }
}
</script>
</body>
</html>
