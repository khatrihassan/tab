<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table 7 detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#3D3D3A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #111111; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
    <a href="StaffTables.dc.html" aria-label="Back to my tables" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="width: 64px; height: 25px; overflow: hidden" aria-label="tab." role="img">

    </div>
    <span style="font-family: 'Space Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1.5px solid #111111; border-radius: 6px">TABLE 07</span>
  </header>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #5C5C58">PARTY OF 3 · ITEMIZED · 2 QR CODES</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">$61.02 left to pay</h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="height: 14px; border-radius: 4px; background: #ECEAE4; overflow: hidden; border: 1.5px solid #111111">
        <div style="width: 36.5%; height: 100%; background: {{accent}}; border-right: 1.5px solid #111111"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5C5C58"><span>Paid <span style="font-family: 'Space Mono', monospace; color: #111111">$35.03</span> of <span style="font-family: 'Space Mono', monospace; color: #111111">$96.05</span></span><span>Tips <span style="font-family: 'Space Mono', monospace; color: #111111">$5.58</span></span></div>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 16px; padding: 0 14px" aria-label="Items">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #EEEDE8">
          <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 15px; font-weight: 500">{{r.item}}</span>
            <span style="align-self: flex-start; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: {{r.bg}}; border: {{r.border}}; color: #111111">{{r.status}}</span>
          </span>
          <span style="font-family: 'Space Mono', monospace; font-size: 14px">{{r.price}}</span>
        </div>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px" aria-label="Payments">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Payments</h2>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E0DA; font-size: 14px">
        <span><strong>Sarah</strong> · Apple Pay · ★ 5</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 13px; color: #3D3D3A">$35.03 + $5.58 tip = $40.61</span>
      </div>
    </section>
  </div>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #E2E0DA; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="StaffAdd.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; border: 1.5px solid #111111; color: #111111; text-decoration: none; font-size: 16px; font-weight: 600">Add items</a>
    <a href="StaffClose.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">Close table</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#FFD23F","#9AD4FF","#FFB8A8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8F031';
    const tag = {
      paid: { bg: accent, border: '1.5px solid #111111' },
      held: { bg: '#FFFFFF', border: '1.5px dashed #111111' },
      open: { bg: '#ECEAE4', border: '1.5px solid #ECEAE4' }
    };
    const rows = [
      ['Burger', 'paid', 'Paid · Sarah', '$18.00'],
      ['Pasta', 'held', 'Held · Jordan · 3:12', '$22.00'],
      ['Salad', 'open', 'Open', '$14.00'],
      ['Nachos ½', 'paid', 'Paid · Sarah', '$8.00'],
      ['Nachos ½', 'open', 'Open', '$8.00'],
      ['House drink ×1', 'paid', 'Paid · Sarah', '$5.00'],
      ['House drink ×2', 'open', 'Open', '$10.00']
    ].map((r) => Object.assign({ item: r[0], status: r[2], price: r[3] }, tag[r[1]]));
    return { accent: accent, rows: rows };
  }
}
</script>
</body>
</html>
