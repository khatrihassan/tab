<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open a table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#3D3D3A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #111111; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
    <a href="StaffTables.dc.html" aria-label="Back to my tables" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="width: 64px; height: 25px; overflow: hidden" aria-label="tab." role="img">
      <img src="/_blob/c01bdf59c4e277fa907d4dd945951896" alt="" style="width: 92px; height: auto; margin: -9px 0 0 -13px; display: block; mix-blend-mode: multiply">
    </div>
    <span style="font-family: 'Space Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1.5px solid #111111; border-radius: 6px">STAFF</span>
  </header>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 22px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Open a table</h1>

    <section style="display: flex; flex-direction: column; gap: 10px" aria-label="Choose a table">
      <span style="font-size: 15px; font-weight: 600">Table <span style="font-weight: 400; color: #5C5C58">(free tables only)</span></span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px" role="group" aria-label="Free tables">
        <sc-for list="{{tables}}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="aspect-ratio: 1 / 1; min-height: 44px; border-radius: 12px; border: 1.5px solid #111111; background: {{t.bg}}; color: #111111; font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; cursor: pointer">{{t.num}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px" aria-label="Server">
      <span style="font-size: 15px; font-weight: 600">Server</span>
      <button type="button" onClick="{{toggleMine}}" aria-pressed="{{mine}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 12px 14px; border-radius: 14px; border: 1px solid #E2E0DA; background: #FFFFFF; color: #111111; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Mine</span>
          <span style="font-size: 12px; color: #5C5C58">You'll get this table's payment alerts.</span>
        </span>
        <span style="flex: 0 0 auto; width: 52px; height: 30px; border-radius: 15px; border: 1.5px solid #111111; background: {{switchBg}}; display: flex; align-items: center; justify-content: {{switchJustify}}; padding: 0 3px; box-sizing: border-box">
          <span style="width: 22px; height: 22px; border-radius: 11px; background: #111111"></span>
        </span>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px" aria-label="Party size">
      <span style="font-size: 15px; font-weight: 600">Party size</span>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 14px; border: 1px solid #E2E0DA; background: #FFFFFF">
        <button type="button" onClick="{{dec}}" aria-label="One fewer guest" style="width: 48px; height: 48px; border-radius: 10px; border: 1.5px solid #111111; background: #FFFFFF; color: #111111; font-family: 'Space Mono', monospace; font-size: 20px; cursor: pointer">−</button>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span style="font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700">{{party}}</span>
          <span style="font-size: 12px; color: #5C5C58">guests</span>
        </span>
        <button type="button" onClick="{{inc}}" aria-label="One more guest" style="width: 48px; height: 48px; border-radius: 10px; border: 1.5px solid #111111; background: #FFFFFF; color: #111111; font-family: 'Space Mono', monospace; font-size: 20px; cursor: pointer">+</button>
      </div>
      <span style="font-size: 12px; color: #5C5C58">Used for "2 of 3 paid" on your table card.</span>
    </section>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #ECEAE4">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="square" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"></path></svg>
      <span style="font-size: 13px; line-height: 1.45; color: #3D3D3A">Guests scan the QR code on the table. The bill shows up once you add items.</span>
    </div>
  </div>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #E2E0DA">
    <a href="StaffAdd.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">Open Table {{table}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#FFD23F","#9AD4FF","#FFB8A8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { table: '08', party: 3, mine: true }; }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#C8F031';
    const tables = ['01', '05', '08', '11'].map((n) => ({
      num: n,
      on: s.table === n,
      bg: s.table === n ? accent : '#FFFFFF',
      pick: () => this.setState({ table: n })
    }));
    return {
      tables: tables,
      table: s.table,
      party: s.party,
      mine: s.mine,
      switchBg: s.mine ? accent : '#ECEAE4',
      switchJustify: s.mine ? 'flex-end' : 'flex-start',
      toggleMine: () => this.setState({ mine: !s.mine }),
      dec: () => this.setState({ party: Math.max(1, s.party - 1) }),
      inc: () => this.setState({ party: Math.min(20, s.party + 1) })
    };
  }
}
</script>
</body>
</html>
