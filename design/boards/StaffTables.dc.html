<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My tables</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#3D3D3A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #111111; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
    <div style="width: 64px; height: 25px; overflow: hidden" aria-label="tab." role="img">
      <img src="/_blob/c01bdf59c4e277fa907d4dd945951896" alt="" style="width: 92px; height: auto; margin: -9px 0 0 -13px; display: block; mix-blend-mode: multiply">
    </div>
    <span style="font-family: 'Space Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1.5px solid #111111; border-radius: 6px">ON SHIFT</span>
  </header>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; font-size: 13px; color: #5C5C58; letter-spacing: 0.02em">[RESTAURANT NAME]</p>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">My tables</h1>
    </div>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px" aria-label="Shift summary">
      <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #5C5C58">Open tables</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700">4</span>
      </div>
      <div style="background: {{accent}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #111111">Tips today</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700">$28.63</span>
      </div>
    </section>

    <div role="status" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 12px; background: #111111; color: #FFFFFF">
      <span style="flex: 0 0 auto; width: 10px; height: 10px; margin-top: 5px; background: {{accent}}"></span>
      <span style="flex: 1 1 auto; font-size: 14px; line-height: 1.4"><strong>Table 9:</strong> Alex paid $37.11 (2 of 3 paid)</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #CFCFCB">now</span>
    </div>

    <sc-for list="{{tables}}" as="t" hint-placeholder-count="4">
      <a href="StaffTable.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E0DA; color: #111111; text-decoration: none">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700">TABLE {{t.num}}</span>
          <span style="padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; background: {{t.pillBg}}; color: {{t.pillFg}}; border: 1.5px solid #111111">{{t.pill}}</span>
        </div>
        <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">{{t.big}}</span>
        <div style="height: 10px; border-radius: 4px; background: #ECEAE4; overflow: hidden; border: 1.5px solid #111111">
          <div style="width: {{t.pct}}; height: 100%; background: {{t.barBg}}"></div>
        </div>
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #3D3D3A">{{t.meta}}</span>
      </a>
    </sc-for>
  </div>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #E2E0DA">
    <a href="StaffOpen.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Open a table
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#FFD23F","#9AD4FF","#FFB8A8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8F031';
    const paying = { pill: 'Paying', pillBg: accent, pillFg: '#111111', barBg: accent };
    const tables = [
      { num: '12', pill: 'Ready to close', pillBg: '#111111', pillFg: '#FFFFFF', barBg: '#111111', big: 'Fully paid', pct: '100%', meta: '2 of 2 paid · $64.41 / $64.41 · tips $9.69' },
      Object.assign({ num: '07', big: '$61.02 left', pct: '36.5%', meta: '1 of 3 paid · $35.03 / $96.05 · tips $5.58' }, paying),
      Object.assign({ num: '09', big: '$37.11 left', pct: '66.7%', meta: '2 of 3 paid · $74.22 / $111.33 · tips $13.36' }, paying),
      { num: '10', pill: 'Dining', pillBg: '#ECEAE4', pillFg: '#111111', barBg: '#ECEAE4', big: 'Bill open', pct: '0%', meta: '0 of 4 paid · $0.00 / $118.65 · tips $0.00' }
    ];
    return { accent: accent, tables: tables };
  }
}
</script>
</body>
</html>
