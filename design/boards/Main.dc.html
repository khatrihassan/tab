<!doctype html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#3D3D3A}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; color: #111111; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">

    </div>
    <span style="font-family: 'Space Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1.5px solid #111111; border-radius: 6px">TABLE 07</span>
  </header>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; font-size: 13px; color: #5C5C58; letter-spacing: 0.02em">[RESTAURANT NAME]</p>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Your bill</h1>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 16px; padding: 4px 16px" aria-label="Items">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid #EEEDE8; gap: 12px">
          <div style="display: flex; gap: 10px; align-items: baseline">
            <span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #5C5C58; min-width: 22px">{{item.qty}}×</span>
            <span style="font-size: 15px; font-weight: 500">{{item.name}}</span>
          </div>
          <span style="font-family: 'Space Mono', monospace; font-size: 14px">{{item.price}}</span>
        </div>
      </sc-for>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0 12px">
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5C5C58"><span>Subtotal</span><span style="font-family: 'Space Mono', monospace">$85.00</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5C5C58"><span>HST 13%</span><span style="font-family: 'Space Mono', monospace">$11.05</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; padding-top: 8px; border-top: 1.5px dashed #111111"><span>Total</span><span style="font-family: 'Space Mono', monospace">$96.05</span></div>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px" aria-label="Balance">
      <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #5C5C58">Already paid</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700">$0.00</span>
      </div>
      <div style="background: {{accent}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #111111">Left to pay</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700">$96.05</span>
      </div>
    </section>
    <p style="margin: 0; font-size: 12px; color: #5C5C58; text-align: center">No app, no account. Pay from this page.</p>
  </div>

  <div style="padding: 14px 20px 28px; background: #F5F4F0; border-top: 1px solid #E2E0DA">
    <a href="Choose.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">Pay bill</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#FFD23F","#9AD4FF","#FFB8A8"]},"$preview":{"width":390,"height":844}}'>

    return {

      items: [
        { qty: 1, name: 'Burger', price: '$18.00' },
        { qty: 1, name: 'Pasta', price: '$22.00' },
        { qty: 1, name: 'Salad', price: '$14.00' },
        { qty: 1, name: 'Nachos', price: '$16.00' },
        { qty: 3, name: 'House drink', price: '$15.00' }

  }
}
</script>
</body>
</html>
